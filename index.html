<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>遇</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="遇">
<meta name="theme-color" content="#F6F1E7">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f6f1e7;
    --panel: #fffdf8;
    --ink: #24211f;
    --soft: #8a857c;
    --accent: #c4552a;
    --accent-soft: #f3e2d8;
    --line: rgba(36,33,31,.12);
    --r: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", -apple-system, system-ui, "Noto Sans SC", sans-serif;
    line-height: 1.6;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }

  /* ── 顶栏：活动名一次设置，管一整晚 ── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 0 12px;
  }
  #event {
    flex: 1; min-width: 0;
    font: inherit; font-size: 16px; font-weight: 600;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 99px;
    padding: 9px 16px; outline: none;
  }
  #event::placeholder { color: var(--soft); font-weight: 400; }
  #event:focus { border-color: var(--accent); }
  .icon-btn {
    flex: none; width: 40px; height: 40px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line);
    color: var(--soft); font-size: 17px; line-height: 1;
    display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:focus-visible, #event:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── 提示条 ── */
  .banner {
    display: none; gap: 10px; align-items: flex-start;
    background: var(--accent-soft); color: var(--accent);
    border-radius: var(--r); padding: 11px 14px; font-size: 13.5px;
    margin-bottom: 12px;
  }
  .banner.show { display: flex; }
  .banner button {
    font: inherit; font-size: 13.5px; font-weight: 600;
    background: none; border: none; color: var(--accent);
    text-decoration: underline; cursor: pointer; padding: 0; flex: none;
  }

  /* ── 拍照热区：整块可点，站着单手能按 ── */
  .shoot {
    display: grid; place-items: center; gap: 6px;
    height: 132px; border-radius: var(--r);
    border: 2px dashed rgba(36,33,31,.22); background: var(--panel);
    color: var(--soft); font-size: 15px; cursor: pointer; text-align: center;
  }
  .shoot strong { font-size: 17px; color: var(--ink); font-weight: 600; }
  .shoot:active { background: #f6efe3; }
  .shoot.compact { height: 52px; border-style: solid; border-width: 1px; }
  .shoot.compact strong { font-size: 15px; }
  .shoot.compact span { display: none; }

  /* ── 卡片预览 ── */
  #stage { display: none; margin-top: 14px; }
  #stage.show { display: block; }
  #preview {
    width: 100%; display: block; border-radius: 10px;
    box-shadow: 0 1px 2px rgba(36,33,31,.1), 0 14px 30px -14px rgba(36,33,31,.4);
  }
  .savehint { font-size: 12.5px; color: var(--soft); text-align: center; margin-top: 8px; }

  /* ── 输入 ── */
  .fields { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .field label {
    display: block; font-size: 12.5px; color: var(--soft); margin-bottom: 4px;
    letter-spacing: .02em;
  }
  .field input {
    width: 100%; font: inherit; font-size: 16px;  /* ≥16px 防止 iOS 聚焦时放大 */
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: #b9b2a6; }

  /* ── 主按钮 ── */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .btn {
    font: inherit; font-size: 17px; font-weight: 600;
    border: 1px solid var(--line); border-radius: 14px;
    padding: 15px; cursor: pointer; text-align: center;
    background: var(--panel); color: var(--ink);
  }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }

  /* ── 设置：上传我的二维码 ── */
  #setup {
    display: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r); padding: 18px; margin-bottom: 14px;
  }
  #setup.show { display: block; }
  #setup h2 { font-size: 16px; margin-bottom: 6px; }
  #setup p { font-size: 13.5px; color: var(--soft); margin-bottom: 14px; }
  #setup ol { font-size: 13.5px; color: var(--soft); margin: 0 0 14px 18px; }
  #setup li { margin: 3px 0; }
  #setup .rule { border: 0; border-top: 1px solid var(--line); margin: 20px 0 18px; }
  .tip { font-size: 12.5px; color: var(--accent); margin: 10px 0 0 !important; min-height: 1em; }
  .qrrow { display: flex; gap: 14px; align-items: center; }
  #qrThumb {
    width: 84px; height: 84px; flex: none; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; object-fit: contain; display: none;
  }
  #qrThumb.show { display: block; }
  .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  footer { text-align: center; color: var(--soft); font-size: 12px; padding: 26px 0 4px; }
</style>
</head>
<body>

<header>
  <input id="event" type="text" placeholder="活动名（例：muShenzhen）" autocomplete="off" enterkeyhint="done">
  <button class="icon-btn" id="gear" type="button" aria-label="设置我的二维码">⚙</button>
</header>

<div class="banner" id="noqr">
  <span>还没上传你的二维码，卡片上会空着。</span>
  <button type="button" id="noqrFix">现在上传</button>
</div>

<section id="setup">
  <h2>我的二维码</h2>
  <p>放在卡片右下角，对方长按就能识别。只存在这台手机上，不会上传到任何服务器。</p>
  <ol>
    <li>微信 → 我 → 二维码名片 → 保存到相册</li>
    <li>在相册里裁成正方形，只留二维码本体</li>
    <li>回到这里上传</li>
  </ol>
  <div class="qrrow">
    <img id="qrThumb" alt="我的二维码">
    <button class="btn" id="pickQR" type="button" style="flex:1">选择图片</button>
  </div>

  <hr class="rule">

  <h2>我的自我介绍</h2>
  <p>活动前写好，整场不变，下场活动再改。三行都是选填 —— 写了才出现在卡片上。
     标签只是帮你别漏项，卡片上不会印出来。</p>
  <div class="fields">
    <div class="field">
      <label for="introWho">我是谁</label>
      <input id="introWho" type="text" autocomplete="off"
             placeholder="Sunny，在做 mu · 全球 builder 驻地">
    </div>
    <div class="field">
      <label for="introInto">对什么感兴趣</label>
      <input id="introInto" type="text" autocomplete="off"
             placeholder="怎么让一群陌生人在三周里长出真实的信任">
    </div>
    <div class="field">
      <label for="introReach">怎么联系我</label>
      <input id="introReach" type="text" autocomplete="off"
             placeholder="微信 sunnyguo · guo.xiaoyu.work@gmail.com">
    </div>
  </div>
  <p class="tip" id="introTip"></p>
</section>

<label class="shoot" id="shoot" for="photo">
  <strong>点这里拍合影</strong>
  <span>会打开系统相机，也可以从相册选</span>
</label>
<input class="hidden-input" id="photo" type="file" accept="image/*">
<input class="hidden-input" id="qrFile" type="file" accept="image/*">

<div id="stage">
  <img id="preview" alt="卡片预览">
  <p class="savehint" id="savehint"></p>

  <div class="fields">
    <div class="field">
      <label for="who">称呼（选填）</label>
      <input id="who" type="text" placeholder="Alex" autocomplete="off" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="line">一句话（选填，可以用键盘上的麦克风口述）</label>
      <input id="line" type="text" placeholder="聊到你在做的地铁噪音项目" autocomplete="off" enterkeyhint="done">
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="save" type="button">① 存到我的相册</button>
    <button class="btn" id="send" type="button">② 发给 TA</button>
  </div>
</div>

<footer>遇 · 拍一张，记住是在哪遇见的</footer>

<script type="module" src="app.js"></script>
</body>
</html>
